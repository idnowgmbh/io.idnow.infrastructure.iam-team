type sessions
  @model(subscriptions: { level: off })
  @auth(
    rules: [
      { allow: groups, groups: ["Auditors"], operations: [read] }
      # The creator may create and read the record but not update or delete it.
      # This row is an audit artifact (who held which role, plus the CloudTrail
      # query id), so the requester must not be able to rewrite or remove it.
      { allow: owner, operations: [create, read] }
      # The user named in `username` and the approvers listed in `approver_ids`
      # may read the session but must not mutate it.
      { allow: owner, ownerField: "username", operations: [read] }
      { allow: owner, ownerField: "approver_ids", operations: [read] }
    ]
  ) {
  id: String!
  startTime: String
  endTime: String
  # Field-level rules stop the creator from reassigning `username` or
  # `approver_ids` after creation. Without these, the owner could hand the
  # record to another identity, or grant/revoke access by rewriting the
  # approver list (Amplify warns about exactly this at compile time).
  username: String
    @auth(
      rules: [
        { allow: groups, groups: ["Auditors"], operations: [read] }
        { allow: owner, operations: [create, read] }
        { allow: owner, ownerField: "approver_ids", operations: [read] }
      ]
    )
  accountId: String
  role: String
  approver_ids: [String]
    @auth(
      rules: [
        { allow: groups, groups: ["Auditors"], operations: [read] }
        { allow: owner, operations: [create, read] }
        { allow: owner, ownerField: "approver_ids", operations: [read] }
      ]
    )
  queryId: String
  expireAt: AWSTimestamp @ttl
  # `owner` is auto-generated. Declaring it read-only stops the creator from
  # reassigning the record to another identity (Amplify warns about this as
  # "owners may reassign ownership for ... sessions: [owner]").
  owner: String
    @auth(
      rules: [
        { allow: groups, groups: ["Auditors"], operations: [read] }
        { allow: owner, operations: [read] }
        { allow: owner, ownerField: "username", operations: [read] }
        { allow: owner, ownerField: "approver_ids", operations: [read] }
      ]
    )
}
